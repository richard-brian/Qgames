    <title>Feedback</title>

<body>

          <img class="QG" src="img/logoname.jpeg" alt="">

            <form class="d-flex" role="search"></form>

    <!-- ======================================== -->
    <!-- NAVBAR -->
    <!-- ======================================== -->

    <header>

        <nav class="navbar navbar-expand-lg bg-black">

            <div class="container-fluid">

                <!-- LOGO -->

                <img class="QG"
                    src="img/logoname.jpeg"
                    alt="">

                <!-- MENU MOBILE -->

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- LINKS -->

                <div class="collapse navbar-collapse"
                    id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">

                            <a class="nav-link active"
                                href="paginaQuiz.html">

                                Página Inicial

                        </li>

                        <li class="nav-item">

                            <a class="nav-link active"
                                href="biblioteca.html">

                                Biblioteca

                            </a>

                        </li>

                    </ul>

                    <!-- LOGIN -->

                    <a class="btn btn-outline"
                        href="login.html">

                        Login

                    </a>

                </div>

            </div>

        </nav>

    </header>


    <!-- ======================================== -->
    <!-- IMAGEM FUNDO -->
    <!-- ======================================== -->

    <img src="img/image (1).png"
        class="imagem-fundo"
        alt="Background">

    <!-- ======================================== -->
    <!-- MAIN -->
    <!-- ======================================== -->

    <main class="feedback-main">

        <!-- CARD -->

        <section class="quiz-box">

            <!-- TÍTULO -->

            <h1>
                Feedback
            </h1>

            <!-- NOTA -->

            <div class="avaliacao-box">

                <label>
                    Como você avalia nosso site?
                </label>

                <select id="nota">

                    <option>
                        0-10
                    </option>

                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>

                </select>

            </div>

            <!-- COMENTÁRIO -->

            <div class="comentario-box">

                <textarea
                    id="comentario"
                    placeholder="Deixe seu comentário..."></textarea>

            </div>

            <!-- CHECKBOX -->

            <div class="publicar-box">

                <label>

                    <input type="checkbox"
                        id="publicar">

                    Publicar comentário publicamente

                </label>

            </div>

            <!-- BOTÃO -->

            <button class="btn-enviar"
                id="btnEnviar">

                Enviar Feedback

            </button>

            <!-- ======================================== -->
            <!-- COMENTÁRIOS -->
            <!-- ======================================== -->

            <div class="comentarios-publicados">

                <h2>
                    Comentários Publicados
                </h2>

                <div id="listaComentarios">

                </div>

            </div>

        </section>

    </main>

    <!-- ======================================== -->
    <!-- FOOTER -->
    <!-- ======================================== -->

    <footer>

        <div class="rodape">

            <!-- LOGO -->

            <div class="camp-log">

                <img class="logo"
                    src="img/logo.jpeg"
                    alt="">

            </div>

            <!-- INFOS -->

            <div class="infos">

                <!-- COMPANY -->

                <div class="company">

                    <h5>
                        COMPANY
                    </h5>

                    <ul class="outros1">

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Sobre nós

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Garanta cupons

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Info link

                            </a>

                        </li>

                    </ul>

                </div>

                <!-- LEGAL -->

                <div class="legal">

                    <h5>
                        LEGAL
                    </h5>

                    <ul class="outros2">

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Políticas de Privacidade

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Políticas de Cookies

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Feedback

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </footer>

    <script src="Js/feedback.js"></script>
