<html lang="pt-br">

<body>

    <header>

        <nav class="navbar navbar-expand-lg bg-black">

            <div class="container-fluid">

                <img class="QG"
                    src="img/logoname.jpeg"
                    alt="">

                <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <div class="collapse navbar-collapse"
                    id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">

                            <a class="nav-link active"
                                href="paginaQuiz.html">

                                Página Inicial

                        </li>

                        <li class="nav-item">

                            <a class="nav-link active"
                                href="biblioteca.html">

                                Biblioteca

                            </a>

                        </li>

                    </ul>

                    <a class="btn btn-outline"
                        href="login.html" style="margin-right: 10px;">

                        Login

                    </a>

                    <a class="btn btn-outline"
                        href="perfil.html">

                        Perfil

                    </a>

                </div>

            </div>

        </nav>

    </header>


    <img src="img/image (1).png"
        class="imagem-fundo"
        alt="Background">

    <main class="feedback-main">

        <section class="quiz-box">

            <h1>
                Feedback
            </h1>

            <div class="avaliacao-box">

                <label>
                    Como você avalia nosso site?
                </label>

                <select id="nota">

                    <option>
                        0-10
                    </option>

                    <option>0</option>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                    <option>4</option>
                    <option>5</option>
                    <option>6</option>
                    <option>7</option>
                    <option>8</option>
                    <option>9</option>
                    <option>10</option>

                </select>

            </div>

            <div class="comentario-box">

                <textarea
                    id="comentario"
                    placeholder="Deixe seu comentário..."></textarea>

            </div>

            <div class="publicar-box">

                <label>

                    <input type="checkbox"
                        id="publicar">

                    Publicar comentário publicamente

                </label>

            </div>

            <button class="btn-enviar"
                id="btnEnviar">

                Enviar Feedback

            </button>

            <div class="comentarios-publicados">

                <h2>
                    Comentários Publicados
                </h2>

                <div id="listaComentarios">

                </div>

            </div>

        </section>

    </main>

    <footer>

        <div class="rodape">

            <div class="camp-log">

                <img class="logo"
                    src="img/logo.jpeg"
                    alt="">

            </div>

            <div class="infos">

                <div class="company">

                    <h5>
                        COMPANY
                    </h5>

                    <ul class="outros1">

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Sobre nós

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Garanta cupons

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Info link

                            </a>

                        </li>

                    </ul>

                </div>

                <div class="legal">

                    <h5>
                        LEGAL
                    </h5>

                    <ul class="outros2">

                        <li class="sobrenos">

                                class="link-info">

                            </a>

                        </li>

                        <li class="sobrenos">

                            <a href="#"
                                class="link-info">

                                Feedback

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="Js/feedback.js"></script>
